name: upande_ta No Claude Attribution

# Keeps `Co-Authored-By: Claude ...` out of `main`, entirely in CI - nothing to
# install locally, no git hooks on anyone's machine.
#
# WHY IT CANNOT BE FIXED AT THE MOMENT OF MERGE
# --------------------------------------------
# This repo already sets squash_merge_commit_message=BLANK and
# squash_merge_commit_title=PR_TITLE, and d6bc72b (the #73 squash) STILL reads:
#
#   fix: monthly attendance sheet, attendance insights (#73)
#
#   Co-authored-by: Claude Opus 5 (1M context) <noreply@anthropic.com>
#
# GitHub derives the squash commit's `Co-authored-by` trailers from the trailers
# on the commits being squashed, and appends them regardless of the body setting
# or of any commit_message passed to the merge API. GitHub Cloud has no
# pre-receive hook to intercept the merge commit either.
#
# So the trailer has to be gone from the BRANCH COMMITS before the merge button
# is pressed - then GitHub has nothing to propagate and the squash lands clean.
# That is what the `sanitize` job below does, server-side, on every PR push.
#
# Make `sanitize` a required status check on `main` (Settings > Branches) and a
# PR physically cannot merge a trailer into main.
#
# NOTE: sanitize force-pushes the PR branch. Anyone else with that branch checked
# out must `git fetch origin && git reset --hard origin/<branch>` afterwards. That
# cost is inherent to rewriting already-pushed commits.
#
# `main` itself is never rewritten: it carries release tags (v1.1.6 contains
# d6bc72b) and semantic-release commits, and force-pushing it would orphan the
# tags and the shas Frappe Cloud recorded for those deploys. The pre-existing
# trailer on d6bc72b stays; `verify-main` only polices what lands from now on.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sanitize (must not be main)"
        required: true
        type: string
      dry_run:
        description: "Report what would change, do not push"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: no-claude-attribution-${{ github.event.pull_request.number || inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  sanitize:
    name: Sanitize branch commits
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Resolve target branch
        id: target
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH:-$PR_BRANCH}"
          if [ "$branch" = "main" ]; then
            echo "::error::Refusing to rewrite main - see the header of this workflow."
            exit 1
          fi
          if [ -n "${PR_REPO:-}" ] && [ "$PR_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR is from fork $PR_REPO; cannot push to it. The contributor must clean the branch."
            exit 1
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Strip attribution from branch commits
        id: rewrite
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail

          base="$(git merge-base origin/main HEAD)"
          start="$(git rev-parse HEAD)"
          echo "start=$start" >>"$GITHUB_OUTPUT"
          echo "Range: ${base:0:9}..$BRANCH ($(git rev-list --count "$base"..HEAD) commits)"

          # Captured, not piped straight into `if !`: a git failure inside a
          # pipeline or command substitution does not trip `set -e`, and would
          # otherwise be indistinguishable from "no matches" - a false pass.
          if ! msgs="$(git log --format='%B' "$base"..HEAD)"; then
            echo "::error::Could not read commit messages for $base..HEAD"
            exit 1
          fi

          if ! printf '%s' "$msgs" |
               grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                       -e 'Generated with \[Claude Code\]'; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Branch is already clean - a squash of this PR will not carry a trailer."
            exit 0
          fi

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --msg-filter "$GITHUB_WORKSPACE/.githooks/strip-claude-trailer.sh" \
            "$base"..HEAD

          # Messages only: the tree must be byte-identical or we do not push.
          if ! git diff --quiet "$start" HEAD; then
            echo "::error::Rewrite changed file content - aborting without pushing."
            git diff --stat "$start" HEAD
            exit 1
          fi

          if git log --format='%B' "$base"..HEAD |
             grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                     -e 'Generated with \[Claude Code\]'; then
            echo "::error::Attribution still present after rewrite - aborting."
            exit 1
          fi

          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "Rewrote ${start:0:9} -> $(git rev-parse --short=9 HEAD), trees identical."

      - name: Force-push the cleaned branch
        if: steps.rewrite.outputs.changed == 'true' && inputs.dry_run != true
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          START: ${{ steps.rewrite.outputs.start }}
        run: |
          set -euo pipefail
          # Lease pinned to the sha this job started from: if anyone pushed while
          # it ran, the push is refused rather than clobbering their work.
          git push --force-with-lease="$BRANCH:$START" origin "HEAD:$BRANCH"
          echo "::notice::Branch $BRANCH rewritten. Anyone with it checked out must run: git fetch origin && git reset --hard origin/$BRANCH"

      - name: Dry-run notice
        if: steps.rewrite.outputs.changed == 'true' && inputs.dry_run == true
        run: echo "::notice::Dry run - rewrite verified but not pushed."

  verify-main:
    name: Verify nothing landed on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check only the commits this push added
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Scoped to the newly pushed commits, so the pre-existing trailer on
          # d6bc72b (inside tag v1.1.6, deliberately kept) never fails this job.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable before-sha (new branch or force-push); checking tip only."
            range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          # Captured, not inlined as <<<"$(git rev-list ...)": a command
          # substitution that fails there is silently treated as empty output,
          # which would report "clean" for a range that could not be read.
          if ! commits="$(git rev-list "$range")"; then
            echo "::error::Could not enumerate $range"
            exit 1
          fi

          found=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! body="$(git log -1 --format='%B' "$sha")"; then
              echo "::error::Could not read $sha"
              exit 1
            fi
            if printf '%s' "$body" |
               grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                       -e 'Generated with \[Claude Code\]'; then
              echo "::error::$sha $(git log -1 --format='%s' "$sha")"
              found=1
            fi
          done <<<"$commits"

          if [ "$found" -eq 1 ]; then
            cat <<'MSG'

          Claude attribution reached main. main is NOT auto-rewritten here - it
          carries release tags and semantic-release commits, so a force-push
          would orphan them.

          Either accept it on this commit, or rewrite main by hand knowing you
          must re-cut any tag at or above it.

          To stop the next one: make the `sanitize` job a required status check
          on main (Settings > Branches), so no PR can merge while its branch
          commits still carry a trailer.
          MSG
            exit 1
          fi
          echo "Clean: no Claude attribution in $range"
